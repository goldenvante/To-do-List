<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do-List</title>
</head>
<body>
  <header class="app-header">
    <h1> To-Do List</h1>
  </header>
  <main class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Projects</h2>
        <button id="add-project-btn" class="icon-btn" type="button" title="New Project" aria-label="New Project">+</button>
      </div>
      <form id="project-form" class="project-form" hidden>
        <input id="project-name-input" type="text" name="name" placeholder="Name Project" maxlength="50" required>
        <div class="form-actions">
          <button type="submit" class="primary-btn">New</button>
          <button type="button" class="secondary-btn" id="cancel-project-btn">Cancel</button>
        </div>
      </form>
      <nav aria-label="Projects">
        <ul id="project-list" class="project-list"></ul>
      </nav>
    </aside>

    <section class="content">
      <div class="content-header">
        <div class="title-block">
          <h2 id="current-project-name">Inbox</h2>
          <p id="project-subtitle" class="project-subtitle"></p>
        </div>
        <button id="add-task-btn" class="primary-btn" type="button">New Task</button>
      </div>
      <div class="content-tools">
        <label class="tool">
          <input type="checkbox" id="show-completed" checked>
          Show completed
        </label>
        <label class="tool">
          Order:
          <select id="sort-select">
            <option value="original">Original Order</option>
            <option value="dueDate">Date </option>
            <option value="priority">Priority</option>
          </select>
        </label>
      </div>
      <form id="task-form" class="task-form" hidden></form>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>
</body>
</html>
